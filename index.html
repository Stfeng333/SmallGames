<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brew & Byte — Cozy Sudoku</title>
  <!-- Google Fonts for Playful & Elegant Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Kalam:wght@400;700&family=Outfit:wght@400;600;800&display=swap"
    rel="stylesheet">

  <style>
    /* Reset & Viewport Constraints */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: 'Outfit', sans-serif;
      background-color: #21120b;
      color: #3b2314;
    }

    /* Wooden Desk Scene Container */
    .desk-wrapper {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      position: relative;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      /* Vertical centering is handled by the notebook's auto margins, so content
         taller than the phone screen scrolls instead of being clipped on top. */
      align-items: flex-start;
      padding: 40px 16px calc(40px + env(safe-area-inset-bottom, 0px));
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 230, 190, 0.08) 0%, rgba(0, 0, 0, 0.7) 100%),
        repeating-linear-gradient(0deg, #3d2214 0px, #321a0e 24px, #271309 48px);
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.85);
    }

    /* Soft Window Sunlight Beam */
    .sunlight-beam {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 65vw;
      height: 65vh;
      background: radial-gradient(ellipse at 0% 0%, rgba(255, 245, 210, 0.22) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* Decorative Desk Props Styling */
    .desk-item {
      position: absolute;
      pointer-events: auto;
      filter: drop-shadow(8px 14px 16px rgba(0, 0, 0, 0.5));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .desk-item:hover {
      transform: scale(1.05) translateY(-3px);
    }

    /* Items Positioning on Desk */
    .prop-tea-mug {
      top: 2%;
      left: 2%;
      width: clamp(110px, 11vw, 160px);
      z-index: 2;
    }

    .prop-boba-cup {
      top: 2%;
      left: 14%;
      width: clamp(95px, 9.5vw, 140px);
      z-index: 2;
    }

    .prop-macbook {
      top: 2%;
      right: 2%;
      width: clamp(200px, 20vw, 320px);
      z-index: 2;
    }

    .prop-ipad {
      bottom: 2%;
      left: 1.5%;
      width: clamp(160px, 16vw, 250px);
      transform: rotate(-8deg);
      z-index: 2;
    }

    .prop-ipad:hover {
      transform: rotate(-5deg) scale(1.05);
    }

    .prop-fountain-pen {
      top: 22%;
      right: 3.5%;
      width: clamp(22px, 2.2vw, 34px);
      transform: rotate(18deg);
      z-index: 2;
    }

    .prop-coffee-bag {
      bottom: 2%;
      right: 2%;
      width: clamp(110px, 11vw, 170px);
      transform: rotate(-5deg);
      z-index: 2;
    }

    .prop-airpods {
      bottom: 26%;
      right: 3.5%;
      width: clamp(75px, 7.5vw, 110px);
      transform: rotate(-12deg);
      z-index: 2;
    }

    .prop-sticky-notes {
      top: 28%;
      left: 2%;
      width: clamp(95px, 9.5vw, 140px);
      transform: rotate(-6deg);
      z-index: 2;
    }

    .prop-pencils {
      bottom: 30%;
      left: 14.5%;
      width: clamp(100px, 10vw, 150px);
      transform: rotate(55deg);
      z-index: 2;
    }

    .prop-papers {
      bottom: 6%;
      right: 14%;
      width: clamp(180px, 18vw, 280px);
      transform: rotate(12deg);
      z-index: 1;
    }

    /* Notebook Centerpiece Overlay */
    .notebook-container {
      position: relative;
      z-index: 10;
      margin: auto; /* collapses to 0 when space runs out — prevents the clipped-top flex bug */
      width: min(100%, 760px);
      min-height: 780px;
      min-height: min(780px, calc(100vh - 88px));
      min-height: min(780px, calc(100svh - 88px));
      background-color: #fbf7ee;
      border-radius: 8px 24px 24px 8px;
      padding: clamp(24px, 3vh, 32px) clamp(20px, 3.5vw, 44px);
      border-left: clamp(20px, 3.5vw, 36px) solid #1b3820;
      box-shadow:
        -20px 25px 45px rgba(0, 0, 0, 0.65),
        inset 0 0 60px rgba(210, 195, 170, 0.45);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Deckled Page Edge FX */
    .notebook-container::after {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 8px;
      background: repeating-linear-gradient(0deg, transparent 0px, transparent 4px, rgba(0, 0, 0, 0.03) 4px, rgba(0, 0, 0, 0.03) 8px);
      border-radius: 0 24px 24px 0;
    }

    /* Double-Loop Spiral Spine */
    .spiral-spine {
      position: absolute;
      left: calc(-1 * clamp(28px, 4vw, 44px));
      top: 3%;
      bottom: 3%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      z-index: 20;
    }

    .spiral-ring {
      width: clamp(32px, 4.2vw, 48px);
      height: clamp(10px, 1.4vh, 16px);
      background: linear-gradient(180deg, #d4d4d8 0%, #3f3f46 45%, #18181b 55%, #a1a1aa 100%);
      border-radius: 8px;
      box-shadow: 4px 5px 8px rgba(0, 0, 0, 0.55);
    }

    /* Notebook Title Header */
    .notebook-header {
      text-align: center;
      width: 100%;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .brand-title {
      font-family: 'Fredoka', cursive;
      font-size: clamp(24px, 3.6vw, 42px);
      font-weight: 700;
      color: #3d2214;
      letter-spacing: 2px;
      margin: 0;
      text-shadow: 1px 2px 0px rgba(255, 255, 255, 0.8);
    }

    .brand-subtitle {
      font-family: 'Kalam', cursive;
      font-size: clamp(13px, 1.8vw, 18px);
      font-weight: 700;
      color: #1f4e2b;
      letter-spacing: 4px;
      margin: -2px 0 0 0;
      text-transform: uppercase;
    }

    /* Sudoku Board Grid */
    .sudoku-board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      width: 100%;
      max-width: min(540px, 68vh);
      /* Shrink so header + board + keypad still fit together on phones */
      max-width: min(540px, max(300px, calc(100vh - 360px)));
      max-width: min(540px, max(300px, calc(100svh - 360px)));
      aspect-ratio: 1 / 1;
      border: 4px solid #2b170c;
      background-color: #2b170c;
      gap: 1.5px;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    }

    .sudoku-cell {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(18px, 3vh, 30px);
      font-weight: 600;
      background-color: #ffffff;
      color: #2563eb;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
      position: relative;
    }

    /* Fixed Given Digits */
    .sudoku-cell.given {
      background-color: #f7f2e7;
      color: #3d2214;
      font-family: 'Kalam', cursive;
      font-weight: 700;
      cursor: default;
    }

    /* Selected & Related Highlights */
    .sudoku-cell.selected {
      background-color: #bfdbfe !important;
      transform: scale(0.96);
      border-radius: 4px;
      z-index: 2;
    }

    .sudoku-cell.highlighted {
      background-color: #eff6ff;
    }

    .sudoku-cell.same-number {
      background-color: #dbeafe;
      font-weight: 700;
    }

    .sudoku-cell.error {
      background-color: #fecaca !important;
      color: #dc2626 !important;
      animation: shake 0.3s ease-in-out;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-3px);
      }

      75% {
        transform: translateX(3px);
      }
    }

    /* Thick 3x3 Box Borders */
    .border-box-right {
      border-right: 3px solid #2b170c !important;
    }

    .border-box-bottom {
      border-bottom: 3px solid #2b170c !important;
    }

    /* Control Keypad & Buttons */
    .controls-wrapper {
      width: 100%;
      max-width: min(540px, 68vh);
      max-width: min(540px, max(300px, calc(100vh - 360px)));
      max-width: min(540px, max(300px, calc(100svh - 360px)));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 6px;
      width: 100%;
    }

    .num-btn {
      aspect-ratio: 1 / 1;
      border: 2px solid #d4c5b0;
      background: #f4eee2;
      color: #3d2214;
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(14px, 2.2vh, 22px);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #d4c5b0;
      transition: all 0.1s ease;
    }

    .num-btn:hover {
      background: #ffffff;
      border-color: #1f4e2b;
      color: #1f4e2b;
      transform: translateY(-2px);
      box-shadow: 0 5px 0 #1f4e2b;
    }

    .num-btn:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #1f4e2b;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .btn-secondary {
      padding: clamp(8px, 1.5vh, 12px) clamp(12px, 2vw, 20px);
      background: #eae2d3;
      color: #3d2214;
      border: 2px solid #c9baa5;
      border-radius: 20px;
      font-family: 'Outfit', sans-serif;
      font-size: clamp(12px, 1.6vh, 15px);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 0 #c9baa5;
      transition: all 0.15s ease;
    }

    .btn-secondary:hover {
      background: #f5efe4;
      transform: translateY(-2px);
    }

    .btn-primary {
      flex: 1;
      padding: clamp(10px, 1.8vh, 14px) clamp(16px, 2.5vw, 28px);
      background: linear-gradient(180deg, #276337 0%, #173d20 100%);
      color: #ffffff;
      border: none;
      border-radius: 24px;
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(14px, 2vh, 18px);
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(23, 61, 32, 0.4), 0 3px 0 #0d2413;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover {
      background: linear-gradient(180deg, #317844 0%, #1c4726 100%);
      transform: translateY(-2px);
      box-shadow: 0 7px 16px rgba(23, 61, 32, 0.5), 0 4px 0 #0d2413;
    }

    .btn-primary:active {
      transform: translateY(2px);
      box-shadow: 0 2px 4px rgba(23, 61, 32, 0.4), 0 1px 0 #0d2413;
    }

    /* Modal Victory Screen Overlay */
    .victory-modal {
      position: absolute;
      inset: 0;
      background: rgba(27, 18, 12, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .victory-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .victory-card {
      background: #fbf7ee;
      border-radius: 24px;
      padding: 36px 44px;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      border: 4px solid #1b3820;
      transform: scale(0.8);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .victory-modal.active .victory-card {
      transform: scale(1);
    }

    /* ---- Small-Screen (Phone) Adjustments ---- */
    @media (max-width: 640px) {
      .notebook-container {
        padding: 20px 12px 22px;
      }

      .spiral-spine {
        left: -14px; /* keep the binder rings fully on-screen */
      }

      .numpad {
        gap: 4px;
      }

      .num-btn {
        aspect-ratio: auto;
        min-height: 36px;
        min-height: clamp(34px, 5svh, 44px); /* comfortable touch target */
      }

      .action-bar {
        gap: 8px;
      }
    }

    button {
      touch-action: manipulation; /* removes double-tap zoom delay on iOS */
    }
  </style>
</head>

    <!-- 3. MacBook Laptop with Live Café Display -->

    <!-- ==================== JAVASCRIPT GAME ENGINE ==================== -->
    <script>
      // --- SUDOKU GENERATOR & SOLVER ---
      function isValid(board, r, c, num) {
        for (let i = 0; i < 9; i++) {
          if (board[r][i] === num || board[i][c] === num) return false;
          const boxR = 3 * Math.floor(r / 3) + Math.floor(i / 3);
          const boxC = 3 * Math.floor(c / 3) + (i % 3);
          if (board[boxR][boxC] === num) return false;
        }
        return true;
      }

      function solveSudoku(board) {
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            if (board[r][c] === 0) {
              const nums = [1, 2, 3, 4, 5, 6, 7, 8, 9].sort(() => Math.random() - 0.5);
              for (let num of nums) {
                if (isValid(board, r, c, num)) {
                  board[r][c] = num;
                  if (solveSudoku(board)) return true;
                  board[r][c] = 0;
                }
              }
              return false;
            }
          }
        }
        return true;
      }

      function generateSudoku() {
        const fullBoard = Array.from({ length: 9 }, () => Array(9).fill(0));
        solveSudoku(fullBoard);
        const solution = fullBoard.map(row => [...row]);

        // Remove 38 cells for balanced intermediate difficulty
        const puzzle = fullBoard.map(row => [...row]);
        let removed = 0;
        while (removed < 38) {
          const r = Math.floor(Math.random() * 9);
          const c = Math.floor(Math.random() * 9);
          if (puzzle[r][c] !== 0) {
            puzzle[r][c] = 0;
            removed++;
          }
        }
        return { puzzle, solution };
      }

      // --- GAME STATE ---
      let initialPuzzle = [];
      let solutionBoard = [];
      let currentBoard = [];
      let selectedCell = null; // { r, c }

      const boardElement = document.getElementById('sudoku-board');
      const victoryModal = document.getElementById('victory-modal');

      function initGame() {
        const generated = generateSudoku();
        initialPuzzle = generated.puzzle;
        solutionBoard = generated.solution;
        currentBoard = initialPuzzle.map(row => [...row]);
        selectedCell = null;
        victoryModal.classList.remove('active');
        renderBoard();
      }

      function renderBoard() {
        boardElement.innerHTML = '';
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            const cell = document.createElement('div');
            cell.className = 'sudoku-cell';

            const isGiven = initialPuzzle[r][c] !== 0;
            if (isGiven) cell.classList.add('given');

            // Thick 3x3 Borders
            if (c % 3 === 2 && c !== 8) cell.classList.add('border-box-right');
            if (r % 3 === 2 && r !== 8) cell.classList.add('border-box-bottom');

            const val = currentBoard[r][c];
            cell.textContent = val !== 0 ? val : '';

            // Selection & Highlights Logic
            if (selectedCell) {
              const isSelected = selectedCell.r === r && selectedCell.c === c;
              const isSameRowCol = selectedCell.r === r || selectedCell.c === c;
              const isSameBox = Math.floor(selectedCell.r / 3) === Math.floor(r / 3) && Math.floor(selectedCell.c / 3) === Math.floor(c / 3);
              const selectedVal = currentBoard[selectedCell.r][selectedCell.c];

              if (isSelected) {
                cell.classList.add('selected');
              } else if (isSameRowCol || isSameBox) {
                cell.classList.add('highlighted');
              }

              if (selectedVal !== 0 && val === selectedVal) {
                cell.classList.add('same-number');
              }
            }

            cell.addEventListener('click', () => selectCell(r, c));
            boardElement.appendChild(cell);
          }
        }
      }

      function selectCell(r, c) {
        selectedCell = { r, c };
        renderBoard();
      }

      function handleInput(num) {
        if (!selectedCell) return;
        const { r, c } = selectedCell;
        if (initialPuzzle[r][c] !== 0) return; // Cannot overwrite givens

        currentBoard[r][c] = num;
        renderBoard();
      }

      function handleErase() {
        if (!selectedCell) return;
        const { r, c } = selectedCell;
        if (initialPuzzle[r][c] !== 0) return;

        currentBoard[r][c] = 0;
        renderBoard();
      }

      function handleHint() {
        if (!selectedCell) return;
        const { r, c } = selectedCell;
        if (initialPuzzle[r][c] !== 0) return;

        currentBoard[r][c] = solutionBoard[r][c];
        renderBoard();
      }

      function checkSolution() {
        let isComplete = true;
        let hasError = false;

        const cells = boardElement.children;
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            const index = r * 9 + c;
            const cellEl = cells[index];
            const val = currentBoard[r][c];

            cellEl.classList.remove('error');

            if (val === 0) {
              isComplete = false;
            } else if (val !== solutionBoard[r][c]) {
              hasError = true;
              cellEl.classList.add('error');
            }
          }
        }

        if (isComplete && !hasError) {
          victoryModal.classList.add('active');
        }
      }

      function nextGame() {
        window.location.href = 'drinkingsunset.html';
      }

      function restartGame() {
        initGame();
      }

      // Keyboard Integration
      window.addEventListener('keydown', (e) => {
        if (!selectedCell) return;

        if (e.key >= '1' && e.key <= '9') {
          handleInput(parseInt(e.key, 10));
        } else if (e.key === 'Backspace' || e.key === 'Delete') {
          handleErase();
        } else if (e.key === 'ArrowUp') {
          selectedCell.r = Math.max(0, selectedCell.r - 1);
          renderBoard();
        } else if (e.key === 'ArrowDown') {
          selectedCell.r = Math.min(8, selectedCell.r + 1);
          renderBoard();
        } else if (e.key === 'ArrowLeft') {
          selectedCell.c = Math.max(0, selectedCell.c - 1);
          renderBoard();
        } else if (e.key === 'ArrowRight') {
          selectedCell.c = Math.min(8, selectedCell.c + 1);
          renderBoard();
        }
      });

      // Start App on Window Load
      window.onload = initGame;
    </script>
